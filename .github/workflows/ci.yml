name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (informational for now)
        continue-on-error: true
        run: |
          pip install ruff
          ruff check llm_pipeline tests
      - name: Tests
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for frontend project
        id: has_frontend
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has_frontend.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.has_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: Lint
        if: steps.has_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: Test
        if: steps.has_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present
      - name: Build
        if: steps.has_frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present
